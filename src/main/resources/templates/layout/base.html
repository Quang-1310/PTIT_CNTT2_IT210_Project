<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Smart Academic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; }
        footer { background: #f8f9fa; padding: 20px 0; border-top: 1px solid #dee2e6; }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <!-- Tên Web bên trái -->
            <a class="navbar-brand fw-bold" th:href="@{/static}">SMART ACADEMIC</a>

            <div class="ms-auto d-flex align-items-center">
                <!-- Dropdown bên phải -->
                <div class="dropdown" th:if="${session.userLogin != null}">
                    <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Chào, <span th:text="${session.userLogin}">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/auth/profile}">Thông tin cá nhân</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}" onclick="return confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống không?')">Đăng xuất</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4">
    <div layout:fragment="content"></div>
</main>

<footer class="text-center mt-auto">
    <div class="container">
        <p class="mb-0 text-muted">&copy; 2026 Project - Smart Academic System</p>
    </div>
</footer>

</body>
</html>
