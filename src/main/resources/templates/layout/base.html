<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Smart Academic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        main.content-wrapper { flex: 1; display: flex; flex-direction: column; width: 100%; }
        .container-fluid { padding-left: 0; padding-right: 0; }
        footer {
            /* Màu nền xanh đậm để tương phản với Header */
            background: #2c3e50;
            color: #ffffff;
            padding: 30px 0;
            width: 100%;
            margin-top: auto;
            border-top: 4px solid #3498db; /* Đường kẻ xanh sáng tạo điểm nhấn */
        }

        footer p {
            margin-bottom: 5px;
            opacity: 0.8;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
            transition: 0.3s;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">SMART ACADEMIC</a>

            <div class="ms-auto">
                <div class="dropdown" th:if="${session.userLogin != null}">
                    <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Chào, <span th:text="${session.userLogin}">admin123@gmail.com</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/auth/profile}"><i class="fas fa-user me-2"></i>Thông tin cá nhân</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}"
                               onclick="return confirm('Bạn có chắc chắn muốn đăng xuất?')">
                            <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="content-wrapper">
    <div class="container-fluid p-0">
        <div layout:fragment="content"></div>
    </div>
</main>

<footer class="text-center">
    <div class="container-fluid px-4">
        <div class="row align-items-center">
            <div class="col-md-4 text-md-start">
                <p class="mb-0">&copy; 2026 <strong>Smart Academic System</strong></p>
                <small>Phát triển bởi PTIT Team</small>
            </div>

            <div class="col-md-4 py-3 py-md-0">
                <a href="#" class="mx-2"><i class="fab fa-facebook fa-lg"></i></a>
                <a href="#" class="mx-2"><i class="fab fa-github fa-lg"></i></a>
                <a href="#" class="mx-2"><i class="fas fa-envelope fa-lg"></i></a>
            </div>

            <div class="col-md-4 text-md-end">
                <small>Hệ thống đang hoạt động: <span class="badge bg-success">Ổn định</span></small>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
