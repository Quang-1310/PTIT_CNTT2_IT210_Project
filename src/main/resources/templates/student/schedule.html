<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Đặt lịch cố vấn | Smart Academic</title>
</head>

<body>

<div layout:fragment="content">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h4 class="mb-0">
            <i class="fas fa-calendar-plus text-primary me-2"></i>
            Đặt lịch cố vấn học tập
        </h4>

        <a th:href="@{/student/history}"
           class="btn btn-outline-primary">
            <i class="fas fa-history me-1"></i>
            Lịch sử đặt lịch
        </a>

    </div>

    <!-- ALERT -->
    <div th:if="${successMsg}"
         class="alert alert-success"
         th:text="${successMsg}">
    </div>

    <div th:if="${errorMsg}"
         class="alert alert-danger"
         th:text="${errorMsg}">
    </div>

    <div class="row">
        <!-- FORM -->
        <div class="col-lg-8">

            <form th:action="@{/student/schedule/book}"
                  th:object="${scheduleForm}"
                  method="post"
                  class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-calendar-check me-2"></i>
                        Form đặt lịch
                    </h5>
                </div>

                <div class="card-body">

                    <!-- CHỌN KHOA -->
                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Chọn khoa/ngành
                        </label>

                        <select class="form-select" id="departmentSelect"
                                onchange="location.href='/student/schedule?deptId=' + this.value">
                            <option value="">-- Chọn khoa --</option>
                            <option th:each="d : ${departments}"
                                    th:value="${d.deptId}"
                                    th:text="${d.deptName}"
                                    th:selected="${param.deptId != null and param.deptId[0] == #strings.toString(d.deptId)}">
                            </option>
                        </select>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>

                    </div>

                    <input type="hidden" id="departmentId" th:field="*{departmentId}">

                    <!-- CHỌN GIẢNG VIÊN -->
                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Chọn giảng viên
                        </label>

                        <select class="form-select"
                                th:field="*{lecturerId}"
                                id="lecturerId">

                            <option value="">
                                -- Chọn giảng viên --
                            </option>

                            <option th:each="lecturer : ${lecturers}"
                                    th:value="${lecturer.userId}"
                                    th:text="${lecturer.user?.profile?.fullName}">
                            </option>

                        </select>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('lecturerId')}" th:errors="*{lecturerId}"></div>

                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Chọn ngày</label>
                        <input type="date"
                               class="form-control"
                               id="bookingDate"
                               name="bookingDate"
                               th:value="${scheduleForm.bookingDate}">
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('bookingDate')}" th:errors="*{bookingDate}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Chọn khung giờ</label>
                        <select class="form-select"
                                id="timeSlot"
                                name="bookingTime">
                            <option value="">-- Chọn giờ --</option>
                            <option value="08:00" th:selected="${scheduleForm.bookingTime?.toString() == '08:00'}">08:00 - 08:30</option>
                            <option value="08:30" th:selected="${scheduleForm.bookingTime?.toString() == '08:30'}">08:30 - 09:00</option>
                            <option value="09:00" th:selected="${scheduleForm.bookingTime?.toString() == '09:00'}">09:00 - 09:30</option>
                            <option value="09:30" th:selected="${scheduleForm.bookingTime?.toString() == '09:30'}">09:30 - 10:00</option>
                            <option value="10:00" th:selected="${scheduleForm.bookingTime?.toString() == '10:00'}">10:00 - 10:30</option>
                            <option value="10:30" th:selected="${scheduleForm.bookingTime?.toString() == '10:30'}">10:30 - 11:00</option>
                            <option value="14:00" th:selected="${scheduleForm.bookingTime?.toString() == '14:00'}">14:00 - 14:30</option>
                            <option value="14:30" th:selected="${scheduleForm.bookingTime?.toString() == '14:30'}">14:30 - 15:00</option>
                            <option value="15:00" th:selected="${scheduleForm.bookingTime?.toString() == '15:00'}">15:00 - 15:30</option>
                            <option value="15:30" th:selected="${scheduleForm.bookingTime?.toString() == '15:30'}">15:30 - 16:00</option>
                            <option value="16:00" th:selected="${scheduleForm.bookingTime?.toString() == '16:00'}">16:00 - 16:30</option>
                            <option value="16:30" th:selected="${scheduleForm.bookingTime?.toString() == '16:30'}">16:30 - 17:00</option>

                        </select>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('bookingTime')}" th:errors="*{bookingTime}"></div>
                    </div>

                    <!-- BUTTON -->
                    <div class="text-center mt-4">

                        <button type="submit"
                                class="btn btn-success btn-lg px-5">

                            <i class="fas fa-calendar-check me-2"></i>
                            ĐẶT LỊCH

                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- SIDEBAR -->
        <div class="col-lg-4">

            <div class="card shadow-sm">

                <div class="card-header bg-info text-white">

                    <h6 class="mb-0">
                        <i class="fas fa-info-circle me-2"></i>
                        Quy định
                    </h6>

                </div>

                <div class="card-body">

                    <ul class="small mb-0">

                        <li class="mb-2">
                            Không được đặt lịch trong quá khứ.
                        </li>

                        <li class="mb-2">
                            Một giảng viên chỉ hỗ trợ 1 sinh viên trong 1 khung giờ.
                        </li>

                        <li class="mb-2">
                            Phải hủy lịch trước 24h.
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {
        const deptSelect = document.getElementById("departmentSelect");
        const deptHidden = document.getElementById("departmentId");
        const dateInput = document.getElementById("bookingDate");
        const timeSelect = document.getElementById("timeSlot");
        const startHidden = document.getElementById("finalStartTime");

        // 1. Đồng bộ Khoa từ URL vào Form
        const urlParams = new URLSearchParams(window.location.search);
        const currentDeptId = urlParams.get('deptId');
        if (currentDeptId) {
            deptSelect.value = currentDeptId;
            deptHidden.value = currentDeptId;
        }

        // 2. Chuyển hướng khi chọn khoa
        deptSelect.addEventListener("change", function () {
            if (this.value) {
                window.location.href = "/student/schedule?deptId=" + this.value;
            }
        });

        document.querySelector("form").addEventListener("submit", function (e) {
            // Đảm bảo đồng bộ ID khoa
            deptHidden.value = deptSelect.value;

            const dateVal = document.getElementById("bookingDate").value;
            const timeVal = document.getElementById("timeSlot").value;
            const lecturerVal = document.getElementById("lecturerId").value;

            if (!deptHidden.value || !dateVal || !timeVal || !lecturerVal) {
                alert("Vui lòng điền đầy đủ thông tin trước khi đặt lịch!");
                e.preventDefault();
            }
        });
    });

</script>

</body>
</html>
