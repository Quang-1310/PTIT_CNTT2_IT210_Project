<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/base}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Danh sách lịch hẹn tư vấn</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4><i class="fas fa-calendar-check text-primary me-2"></i>Quản lý lịch tư vấn phụ trách</h4>
    </div>

    <!-- Thông báo -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h6 class="mb-0 fw-bold">Yêu cầu tư vấn mới (Chờ duyệt)</h6>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>STT</th>
                        <th>Sinh viên</th>
                        <th>Thời gian</th>
                        <th>Trạng thái</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s, iter : ${pendingSessions}">
                        <td th:text="${iter.count}">1</td>
                        <td>
                            <div class="fw-bold" th:text="${s.student.profile.fullName}">Nguyễn Văn A</div>
                            <small class="text-muted" th:text="${s.student.email}">sv@ptit.edu.vn</small>
                        </td>
                        <td>
                            <div><i class="far fa-calendar me-1"></i> <span th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy')}"></span></div>
                            <small class="text-muted"><i class="far fa-clock me-1"></i>
                                <span th:text="${#temporals.format(s.startTime, 'HH:mm')}"></span> -
                                <span th:text="${#temporals.format(s.endTime, 'HH:mm')}"></span>
                            </small>
                        </td>
                        <td>
                            <!-- PENDING -->
                            <span th:if="${s.status == 'PENDING'}"
                                  class="badge bg-warning text-dark">
                                Chờ xác nhận
                            </span>

                            <!-- CONFIRMED -->
                            <span th:if="${s.status == 'CONFIRMED'}"
                                  class="badge bg-info text-dark">
                                Đã xác nhận
                            </span>

                            <!-- COMPLETED -->
                            <span th:if="${s.status == 'COMPLETED'}"
                                  class="badge bg-success">
                                Hoàn thành
                            </span>

                            <!-- CANCELLED -->
                            <span th:if="${s.status == 'CANCELLED'}"
                                  class="badge bg-danger">
                                Đã hủy
                            </span>
                        </td>
                        <td class="text-center">

                            <!-- Chỉ hiện nút khi chưa hoàn thành -->
                            <a th:if="${s.status != 'COMPLETED' && s.status != 'CONFIRMED' && s.status != 'CANCELLED'}"
                               th:href="@{/lecturer/assessment/{id}(id=${s.sessionId})}"
                               class="btn btn-primary btn-sm">

                                <i class="fas fa-edit me-1"></i>
                                Tiếp nhận & Đánh giá
                            </a>

                            <!-- Nếu đã hoàn thành -->
                            <span th:if="${s.status == 'COMPLETED'}"
                                  class="text-success fw-bold">
                                <i class="fas fa-check-circle me-1"></i>
                                Đã xử lý
                            </span>

                            <!-- Nếu đã hủy -->
                            <span th:if="${s.status == 'CANCELLED'}"
                                  class="text-danger fw-bold">
                                <i class="fas fa-times-circle me-1"></i>
                                Đã hủy
                            </span>

                        </td>
                    </tr>
                    <!-- Trường hợp danh sách trống -->
                    <tr th:if="${#lists.isEmpty(pendingSessions)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                            Hiện tại không có yêu cầu tư vấn nào cần xử lý.
                        </td>
                    </tr>
                    </tbody>
                </table>


            </div>

        </div>
    </div>
    <nav th:if="${totalPages >= 1}" aria-label="Equipment pagination" class="mt-4">
        <ul class="pagination justify-content-center mb-0">

            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/lecturer/home(
                   page=${currentPage - 1},
                   size=5
               )}">
                    <i class="fas fa-chevron-left me-1"></i> Trước
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                class="page-item"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/lecturer/home(
                   page=${i},
                   size=5
               )}"
                   th:text="${i + 1}"></a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/lecturer/home(
                   page=${currentPage + 1},
                   size=5
               )}">
                    Sau <i class="fas fa-chevron-right ms-1"></i>
                </a>
            </li>
        </ul>

    </nav>

</div>
</body>
</html>
