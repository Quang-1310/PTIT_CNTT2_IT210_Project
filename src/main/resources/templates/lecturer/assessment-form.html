<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
<!--    <meta charset="utf-8">-->
<!--    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">-->

<!--    &lt;!&ndash; Bootstrap CSS &ndash;&gt;-->
<!--    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"-->
<!--          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">-->
</head>
<body>

<div layout:fragment="content" class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Hoàn tất ca tư vấn & Đánh giá</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/lecturer/assessment/submit}" th:object="${assessmentDTO}" method="post" id="assessmentForm">
                <input type="hidden" th:field="*{sessionId}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <p><strong>Sinh viên:</strong> <span th:text="${sessionCurrent.student.profile.fullName}"></span></p>
                    </div>
                    <div class="col-md-6 text-end text-muted">
                        <i class="far fa-clock"></i> <span th:text="${#temporals.format(sessionCurrent.startTime, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="assessment" class="form-label fw-bold">Nội dung đánh giá năng lực:</label>
                    <textarea id="assessment" th:field="*{assessment}" class="form-control" rows="4" placeholder="Nhập nhận xét về sinh viên..."></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('assessment')}" th:errors="*{assessment}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="labSelect" class="form-label fw-bold">Chỉ định phòng Lab:</label>
                        <select id="labSelect" th:field="*{labId}" class="form-select"
                                th:onchange="|location.href='/lecturer/assessment/' + ${sessionCurrent.sessionId} + '?labId=' + this.value + '&' + 'currentEval=' + encodeURIComponent(document.getElementById('assessment').value)|">
                            <option value="">-- Chọn phòng Lab --</option>
                            <option th:each="l : ${labs}"
                                    th:value="${l.labId}"
                                    th:text="${l.labName}">
                            </option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('labId')}" th:errors="*{labId}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="equipmentIds" class="form-label fw-bold">Thiết bị cấp phát (theo Lab):</label>
                        <select id="equipmentIds" th:field="*{equipmentIds}" class="form-select" multiple size="4"
                                th:disabled="${equipments == null or #lists.isEmpty(equipments)}">
                            <option th:if="${equipments == null}" value="">-- Vui lòng chọn Lab trước --</option>
                            <option th:each="e : ${equipments}"
                                    th:value="${e.equipmentId}"
                                    th:text="${e.equipmentName}">
                            </option>
                        </select>
                        <small class="text-muted">Giữ Ctrl để chọn nhiều thiết bị</small>
                    </div>
                </div>

                <div class="text-end mt-3">
                    <a th:href="@{/lecturer/home}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fas fa-save me-1"></i> Xác nhận hoàn tất
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const assessmentArea = document.getElementById("assessment");
        const sessionId = /*[[${sessionCurrent.sessionId}]]*/ 0;

        // 1. Khôi phục nội dung từ localStorage ngay khi trang vừa load xong
        const savedText = localStorage.getItem("temp_eval_" + sessionId);
        if (savedText && !assessmentArea.value) {
            assessmentArea.value = savedText;
        }

        // 2. TỰ ĐỘNG LƯU: Cứ giảng viên gõ chữ đến đâu, lưu đến đó (input event)
        // Cách này an toàn hơn việc đợi đến khi đổi Lab mới lưu
        assessmentArea.addEventListener("input", function() {
            localStorage.setItem("temp_eval_" + sessionId, this.value);
        });

        // 3. Xóa bộ nhớ tạm khi submit thành công
        document.getElementById("assessmentForm").addEventListener("submit", function() {
            localStorage.removeItem("temp_eval_" + sessionId);
        });
    });
</script>
</body>
</html>
