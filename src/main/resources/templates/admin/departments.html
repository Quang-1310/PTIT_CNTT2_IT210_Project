<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Danh sách khoa | Admin</title>
</head>
<body>
<div layout:fragment="adminContent">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-primary"><i class="fas fa-university me-2"></i>Danh sách Khoa</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4" style="width: 40%;">Mã Khoa (ID)</th>
                    <th>Tên Khoa</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dept : ${departments}">
                    <td class="ps-4" th:text="${dept.deptId}">1</td>
                    <td><strong th:text="${dept.deptName}">Tên khoa </strong></td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td class="text-center py-4 text-muted">Chưa có dữ liệu khoa nào được tạo.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
