<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Thêm giảng viên</title>
</head>
<body>
<div layout:fragment="adminContent">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 text-primary"><i class="fas fa-user-plus me-2"></i>Tạo tài khoản Giảng viên</h5>
                </div>
                <div class="card-body p-4">
                    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMsg}"></span>
                        <button type="button" class="btn-close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form th:action="@{/admin/add-lecturer}" th:object="${registerDTO}" method="post">

                        <div class="row mt-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Họ và tên</label>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A">
                                <p class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="0987654321">
                                <p class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email (Tài khoản)</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="lecturer@ptit.edu.vn">
                            <p class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Mật khẩu khởi tạo</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="********">
                            <p class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Xác nhận mật khẩu</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="********">
                            <p class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                        </div>

                        <div class="alert alert-info py-2 small">
                            <i class="fas fa-info-circle me-1"></i> Tài khoản này sẽ được cấp quyền <strong>LECTURER</strong> mặc định.
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/overview}" class="btn btn-light">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4">Xác nhận thêm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
