<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Smart Academic & Lab Support</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .register-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
        }
        .input-group {
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
            overflow: hidden;
        }

        .input-group-text,
        .form-control {
            border: none !important;
            box-shadow: none !important; /* Xóa đổ bóng mặc định */
            background-color: transparent !important;
        }

        .input-group:focus-within {
            border-color: #0d6efd !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
        }

        /* Viền đỏ cho input-group khi có lỗi */
        .input-group.has-error {
            border-color: #dc3545 !important;
        }

        /* Đổi màu icon sang đỏ khi có lỗi */
        .input-group.has-error .input-group-text {
            color: #dc3545 !important;
        }

        /* Đổ bóng đỏ khi người dùng nhấn vào ô đang bị lỗi */
        .input-group.has-error:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important;
            border-color: #dc3545 !important;
        }

        .input-group.has-error:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important;
        }

        .input-group-text {
            padding-right: 0.5rem;
            color: #6c757d;
        }

        .error-message {
            font-size: 0.85rem;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card register-card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Smart Academic</h2>
                    <p class="text-muted">Tạo tài khoản để bắt đầu hỗ trợ học tập</p>
                </div>

                <form th:action="@{/auth/register}" th:object="${registerDTO}" method="post" novalidate>

                    <!-- Họ và tên -->
                    <div class="mb-3">
                        <label class="form-label fw-medium">Họ và tên</label>
                        <div class="input-group" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error' : ''">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   placeholder="Nhập họ tên đầy đủ">
                        </div>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email sinh viên</label>
                        <div class="input-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="example@student.ptit.edu.vn">
                        </div>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="mb-3">
                        <label class="form-label fw-medium">Số điện thoại</label>
                        <div class="input-group" th:classappend="${#fields.hasErrors('phone')} ? 'has-error' : ''">
                            <span class="input-group-text"><i class="bi bi-phone"></i></span>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="0xxxxxxxxx">
                        </div>
                        <div class="error-message mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="row">
                        <!-- Mật khẩu -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium">Mật khẩu</label>
                            <div class="input-group" th:classappend="${#fields.hasErrors('password')} ? 'has-error' : ''">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control"
                                       placeholder="••••••">
                            </div>
                            <div class="error-message mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium">Xác nhận</label>
                            <div class="input-group" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error' : ''">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" th:field="*{confirmPassword}" class="form-control"
                                       placeholder="••••••">
                            </div>
                            <div class="error-message mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill">Đăng ký ngay</button>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-muted">Đã có tài khoản? </span>
                        <a th:href="@{/auth/login}" class="text-primary fw-bold text-decoration-none">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
