<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/base}">
<head>
  <title>Thông tin cá nhân</title>
</head>
<body>
<div layout:fragment="content">
  <div class="card shadow mx-auto" style="max-width: 600px;">
    <div class="card-header bg-white">
      <h4 class="mb-0">Cập nhật thông tin cá nhân</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/auth/profile/update}" th:object="${userProfile}" method="post">
        <div class="mb-3">
          <label class="form-label">Email (Không thể sửa)</label>
          <input type="text" class="form-control bg-light" th:field="*{email}" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input type="text" name="fullName" class="form-control" th:field="*{fullName}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="text" name="phone" class="form-control" th:field="*{phone}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Địa chỉ</label>
          <input type="text" name="address" class="form-control" th:field="*{address}">
        </div>
        <div class="row g-2 mt-4">
          <div class="col-sm-6">
            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-save me-1"></i> Lưu thay đổi
            </button>
          </div>
          <div class="col-sm-6">
            <button type="button" class="btn btn-outline-secondary w-100" onclick="history.back()">
              Hủy bỏ
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
