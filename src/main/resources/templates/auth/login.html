<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Academic</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15); overflow: hidden; }
        .login-banner { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; display: flex; flex-direction: column; justify-content: center; padding: 3rem; }

        /* Custom Input Group */
        .input-group {
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            background-color: #fff;
            overflow: hidden;
        }
        .input-group-text, .form-control { border: none !important; box-shadow: none !important; background-color: transparent !important; }
        .input-group:focus-within { border-color: #0d6efd !important; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important; }

        /* Error States */
        .input-group.has-error { border-color: #dc3545 !important; }
        .input-group.has-error .input-group-text { color: #dc3545 !important; }
        .input-group.has-error:focus-within { box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important; }
        .error-message { font-size: 0.85rem; color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card login-card">
                <div class="row g-0">
                    <!-- Banner -->
                    <div class="col-md-5 login-banner d-none d-md-flex text-center">
                        <i class="bi bi-mortarboard-fill mb-4" style="font-size: 4rem;"></i>
                        <h3 class="fw-bold">Chào mừng trở lại!</h3>
                        <p class="opacity-75">Hệ thống hỗ trợ học tập và quản lý thiết bị thông minh dành cho sinh viên PTIT.</p>
                    </div>

                    <!-- Form -->
                    <div class="col-md-7 p-4 p-lg-5 bg-white">
                        <h4 class="fw-bold mb-3">Đăng nhập</h4>
                        <p class="text-muted mb-4">Vui lòng nhập tài khoản để tiếp tục.</p>

                        <!-- Lỗi tổng quát từ Controller (nếu sai tài khoản/mật khẩu) -->
                        <div th:if="${loginError}" class="alert alert-danger p-2 small mb-4 border-0 shadow-sm">
                            <i class="bi bi-exclamation-circle me-2"></i> <span th:text="${loginError}"></span>
                        </div>

                        <form th:action="@{/auth/login}" th:object="${loginDTO}" method="post">

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label fw-medium">Email sinh viên</label>
                                <div class="input-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="example@student.ptit.edu.vn">
                                </div>
                                <div class="error-message mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label fw-medium">Mật khẩu</label>
                                    <a href="#" class="text-decoration-none small">Quên mật khẩu?</a>
                                </div>
                                <div class="input-group" th:classappend="${#fields.hasErrors('password')} ? 'has-error' : ''">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••">
                                </div>
                                <div class="error-message mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Remember Me (Optional) -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary rounded-pill shadow-sm py-2 fw-bold">Đăng nhập</button>
                            </div>

                            <div class="text-center mt-4">
                                <span class="text-muted">Chưa có tài khoản? </span>
                                <a th:href="@{/auth/register}" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
